name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: |
        cd backend
        go mod download
        go get -v ./...
        go mod tidy

    - name: Verify dependencies
      run: |
        cd backend
        go mod verify

    - name: Run tests
      run: |
        cd backend/test
        go test ./... -v
