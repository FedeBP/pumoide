name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.22.4'  # Specify the Go version

      - name: Install dependencies
        run: |
          cd backend  # Adjust this if your Go files are in a different directory
          go mod download

      - name: Run tests
        run: |
          cd backend  # Adjust this if your Go files are in a different directory
          go test ./... -v